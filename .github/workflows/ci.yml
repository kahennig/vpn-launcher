name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pyyaml>=6.0" pytest

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: pytest tests/test_profiles.py tests/test_paths.py tests/test_services.py -v
