name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
          pip install PyQt6>=6.5 pytest pytest-qt

      - name: Install package
        run: pip install -e .

      - name: Run tests
        uses: coactions/setup-xvfb@v1
        with:
          run: pytest tests/ -v
