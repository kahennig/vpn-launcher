name: Build Windows Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller "PyQt6>=6.5" "pyyaml>=6.0"
          pip install -e .

      - name: Build exe
        run: pyinstaller ovpn-launcher.spec

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS installer
        run: makensis installer.nsi

      - name: Upload exe artifact
        uses: actions/upload-artifact@v5
        with:
          name: ovpn-launcher-windows-exe
          path: dist/ovpn-launcher.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: ovpn-launcher-windows-setup
          path: dist/ovpn-launcher-setup.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ovpn-launcher.exe
            dist/ovpn-launcher-setup.exe
