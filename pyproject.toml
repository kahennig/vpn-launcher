[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovpn-launcher"
version = "0.1.0"
description = "Multi-version OpenVPN connection manager with GUI and CLI"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Andreas Hennig", email = "kahennig.work@gmail.com" }]
keywords = ["openvpn", "vpn", "kde", "plasma", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = ["PyQt6>=6.5", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-qt>=4.0"]

[project.urls]
Homepage = "https://github.com/kahennig/vpn-launcher"
Issues = "https://github.com/kahennig/vpn-launcher/issues"

[project.scripts]
ovpn-app = "ovpn_launcher.app:main"
ovpn-connect = "ovpn_launcher.cli:main"

[project.gui-scripts]
ovpn-launcher = "ovpn_launcher.app:main"

[tool.setuptools.packages.find]
where = ["src"]
